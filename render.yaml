services:
  - type: web
    name: ordergrid-production
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://ordergrid-production.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY_BASE64
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CARD_PROVIDER
        value: disabled
      - key: CARD_PROVIDER_API_KEY
        sync: false
      - key: CARD_PROVIDER_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_STOREFRONT_TOKEN
        sync: false
