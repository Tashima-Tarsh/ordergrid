services:
  - type: keyvalue
    name: ordergrid-jobs
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
  - type: web
    name: ordergrid-api
    runtime: node
    plan: standard
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars: &appEnv
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: ordergrid-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: ordergrid-jobs, property: connectionString }
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY_BASE64
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CARD_PROVIDER
        value: disabled
      - key: CARD_PROVIDER_API_KEY
        sync: false
      - key: CARD_PROVIDER_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_STOREFRONT_TOKEN
        sync: false
  - type: worker
    name: ordergrid-worker
    runtime: node
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run worker
    maxShutdownDelaySeconds: 300
    envVars: *appEnv
databases:
  - name: ordergrid-db
    plan: basic-1gb
    postgresMajorVersion: "17"
    databaseName: ordergrid
    user: ordergrid
    ipAllowList: []
