services:
  - type: web
    name: ordergrid-production
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://ordergrid-production.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: REDIS_URL
        sync: false
      - key: WORKER_API_TOKEN
        sync: false
      - key: ORDERGRID_MANAGED_EXECUTION
        value: "true"
      - key: ORDERGRID_MANAGED_PARALLEL
        value: "2"
      - key: ORDERGRID_MANAGED_BASKETS
        value: "10"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY_BASE64
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CARD_PROVIDER
        value: disabled
      - key: CARD_PROVIDER_API_KEY
        sync: false
      - key: CARD_PROVIDER_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_STOREFRONT_TOKEN
        sync: false
      - key: ENKASH_BASE_URL
        sync: false
      - key: ENKASH_TOKEN_URL
        sync: false
      - key: ENKASH_PARTNER_ID
        sync: false
      - key: ENKASH_BASIC_AUTH
        sync: false
      - key: ENKASH_USERNAME
        sync: false
      - key: ENKASH_PASSWORD
        sync: false
      - key: ENKASH_CLIENT_ID
        sync: false
      - key: ENKASH_COMPANY_ID
        sync: false
      - key: ENKASH_CARD_ACCOUNT_ID
        sync: false
      - key: CARDHOLDER_EMAIL
        sync: false
      - key: CARDHOLDER_MOBILE
        sync: false
      - key: CARDHOLDER_FIRST_NAME
        sync: false
      - key: CARDHOLDER_LAST_NAME
        sync: false
      - key: CARDHOLDER_GENDER
        sync: false
      - key: CARDHOLDER_PAN
        sync: false
      - key: CARDHOLDER_SPECIAL_DATE
        sync: false
