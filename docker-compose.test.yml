services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ordergrid_test
      POSTGRES_USER: ordergrid
      POSTGRES_PASSWORD: ordergrid_test_password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordergrid -d ordergrid_test"]
      interval: 3s
      timeout: 3s
      retries: 5
