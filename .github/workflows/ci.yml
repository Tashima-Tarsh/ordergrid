name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ordergrid_test
          POSTGRES_USER: ordergrid
          POSTGRES_PASSWORD: ordergrid_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ordergrid:ordergrid_test_password@localhost:5432/ordergrid_test
      NODE_ENV: test
      APP_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci_session_secret_32_bytes_minimum_length!
      DATA_ENCRYPTION_KEY_BASE64: YXV0b2dlbmVyYXRlZF8zMmJ5dGVfa2V5X2Zvcg==1234567890abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run Database Migrations
        run: npm run db:migrate
      - name: Run Integration Tests
        run: npm run test:integration
      - name: Run Load & Concurrency Smoke Test
        run: npm run test:load
      - name: Validate Workers Free configuration
        run: npx --yes wrangler@4.136.1 deploy --dry-run --outdir /tmp/ordergrid-wrangler-dry-run
      - name: Frontend/card connector contract smoke test
        run: npm run smoke:frontend
      - name: End-to-end showroom checkout smoke test
        run: npm run smoke:demo
      - name: User-only workspace contract smoke test
        run: npm run smoke:users
      - name: Autopilot policy enforcement smoke test
        run: node scripts/smoke-automation.mjs
      - name: Audit production dependencies
        run: npm run audit:ci
