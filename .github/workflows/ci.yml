name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build Cloudflare Container image
        run: docker build --file Dockerfile.cloudflare --tag ordergrid-cloudflare-ci .
      - name: Frontend/card connector contract smoke test
        run: npm run smoke:frontend
      - name: End-to-end showroom checkout smoke test
        run: npm run smoke:demo
      - name: User-only workspace contract smoke test
        run: npm run smoke:users
      - name: Autopilot policy enforcement smoke test
        run: node scripts/smoke-automation.mjs
      - name: Audit production dependencies
        run: npm run audit:ci
