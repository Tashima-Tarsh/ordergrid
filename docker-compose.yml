services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ordergrid
      POSTGRES_USER: ordergrid
      POSTGRES_PASSWORD: OrderGrid2026SecurePostgres!
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordergrid -d ordergrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:3000}
      - DATABASE_URL=postgres://ordergrid:OrderGrid2026SecurePostgres!@db:5432/ordergrid
      - DB_SSL=false
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-ordergrid_session_secret_2026_super_secure_32bytes}
      - DATA_ENCRYPTION_KEY_BASE64=${DATA_ENCRYPTION_KEY_BASE64:-YXV0b2dlbmVyYXRlZF8zMmJ5dGVfa2V5X2Zvcg==1234567890abcdef}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-ordergrid_worker_token_secure_min_32_chars_2026}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-amyhod3@gmail.com}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-OrderGrid2026SecureAdmin!}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
