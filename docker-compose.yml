services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ordergrid
      POSTGRES_USER: ordergrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordergrid -d ordergrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:3000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_ORIGIN=${APP_ORIGIN:-http://3.106.181.196:3000}
      - DATABASE_URL=postgres://ordergrid:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/ordergrid
      - DB_SSL=false
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - DATA_ENCRYPTION_KEY_BASE64=${DATA_ENCRYPTION_KEY_BASE64}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - BEDROCK_REGION=${BEDROCK_REGION:-ap-southeast-2}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-apac.amazon.nova-lite-v1:0}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - ORDERGRID_MANAGED_EXECUTION=${ORDERGRID_MANAGED_EXECUTION:-true}
      - ORDERGRID_CHROME_PATH=/usr/bin/chromium
    volumes:
      - ordergrid_profiles:/app/.ordergrid
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ordergrid_profiles:
